name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per pull request, so a new push cancels the run it replaces. On main every
  # commit gets its own group, so none of them is left without a run.
  group: "ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The browser tests drive Chromium, which npm does not install. It is downloaded on every
      # run: Playwright's CI guide advises against caching it, because restoring takes about as
      # long as downloading, and the system libraries that it needs on Linux cannot be cached.
      - name: Install Chromium and the system libraries it needs
        if: runner.os == 'Linux'
        run: npm run browser:install -- --with-deps
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npm run browser:install
      # Chromium runs in its sandbox (ADR 0008), which on Linux needs unprivileged user namespaces.
      # Ubuntu 23.10 and later restrict them through AppArmor, and Chromium then stops with "No
      # usable sandbox" (read, not run here), so the runner allows them for the tests. The first
      # run on Ubuntu shows whether this step is needed and enough.
      - name: Allow the user namespaces of Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run ci:full

  lockfile-age:
    name: Lockfile age
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # This job installs nothing. Without this, setup-node would save an empty npm cache
          # under the same key that the verify jobs restore.
          package-manager-cache: false
      # The script only uses Node built-ins.
      - run: npm run check:lockfile-age
